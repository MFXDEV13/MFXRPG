name: MFXRPG
version: 1.0.0-SNAPSHOT
main: id.mfx.rpg.MFXRPG
api-version: "26.2"
description: Modern modular RPG progression plugin.
author: MFX
softdepend:
  - Vault
  - PlaceholderAPI

commands:
  rpg:
    usage: /rpg
    permission: mfxrpg.use
  rank:
    usage: /rank
    permission: mfxrpg.rank.use
  rankup:
    usage: /rankup
    permission: mfxrpg.rankup
  prestige:
    usage: /prestige
    permission: mfxrpg.prestige
  jobs:
    usage: /jobs [join|leave|stats]
    permission: mfxrpg.jobs.use
  daily:
    usage: /daily
    permission: mfxrpg.daily.claim
  quests:
    usage: /quests
    permission: mfxrpg.quests.use
  achievements:
    usage: /achievements
    permission: mfxrpg.achievements.use
  profile:
    usage: /profile [player]
    permission: mfxrpg.use
  top:
    usage: /top [category]
    permission: mfxrpg.top.use
  mfxrpg:
    usage: /mfxrpg reload
    permission: mfxrpg.admin
  crate:
    usage: /crate [crateId]
    permission: mfxrpg.crate.use
  battlepass:
    aliases: [ bp ]
    usage: /battlepass
    permission: mfxrpg.battlepass.use

permissions:
  mfxrpg.use:
    default: true
  mfxrpg.rank.use:
    default: true
  mfxrpg.rankup:
    default: true
  mfxrpg.prestige:
    default: true
  mfxrpg.jobs.use:
    default: true
  mfxrpg.daily.claim:
    default: true
  mfxrpg.quests.use:
    default: true
  mfxrpg.achievements.use:
    default: true
  mfxrpg.top.use:
    default: true
  mfxrpg.profile.others:
    default: op
  mfxrpg.admin:
    default: op
  mfxrpg.admin.reload:
    default: op
