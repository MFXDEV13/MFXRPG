settings:
  default-open-cooldown-seconds: 0
  broadcast-rare-rewards: true
  audit-history-limit: 10

crates:
  adventurer:
    display-name: "&aAdventurer Crate"
    icon: CHEST
    key-name: "Adventurer Key"
    open-cooldown-seconds: 0
    pity:
      enabled: true
      target-rarities:
        - epic
        - legendary
      guarantee-after-misses: 20
    rewards:
      coins_small:
        display-name: "&e250 Coins"
        rarity: common
        weight: 55
        material: GOLD_NUGGET
        commands:
          - "eco give %player% 250"
      coins_medium:
        display-name: "&e750 Coins"
        rarity: rare
        weight: 25
        material: GOLD_INGOT
        commands:
          - "eco give %player% 750"
      xp_bundle:
        display-name: "&b500 Rank XP"
        rarity: rare
        weight: 15
        material: EXPERIENCE_BOTTLE
        commands:
          - "mfxrpg addrankxp %player% 500"
      epic_key:
        display-name: "&dEpic Key"
        rarity: epic
        weight: 4
        material: AMETHYST_SHARD
        commands:
          - "crate give %player% adventurer 2"
      legendary_title:
        display-name: "&6Explorer Title"
        rarity: legendary
        weight: 1
        material: NETHER_STAR
        commands:
          - "lp user %player% permission set mfxrpg.title.explorer"

  champion:
    display-name: "&6Champion Crate"
    icon: ENDER_CHEST
    key-name: "Champion Key"
    open-cooldown-seconds: 2
    pity:
      enabled: true
      target-rarities:
        - legendary
      guarantee-after-misses: 35
    rewards:
      champion_coins:
        display-name: "&e5,000 Coins"
        rarity: rare
        weight: 65
        material: GOLD_BLOCK
        commands:
          - "eco give %player% 5000"
      champion_xp:
        display-name: "&b2,000 Rank XP"
        rarity: epic
        weight: 25
        material: EXPERIENCE_BOTTLE
        commands:
          - "mfxrpg addrankxp %player% 2000"
      champion_title:
        display-name: "&6Champion Title"
        rarity: legendary
        weight: 10
        material: NETHER_STAR
        commands:
          - "lp user %player% permission set mfxrpg.title.champion"